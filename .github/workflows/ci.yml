name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: |
          swift --version
          cmake --version

      - name: Build SWORD
        run: ./Scripts/build-libsword.sh

      - name: Run tests
        run: ./Scripts/test.sh
