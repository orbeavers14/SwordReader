name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: ./Scripts/test.sh

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme SwordKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/docc \
            CODE_SIGNING_ALLOWED=NO

  platform-build:
    name: Build for ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS and iPadOS
            destination: generic/platform=iOS Simulator
            derived-data: ios
          - name: tvOS
            destination: generic/platform=tvOS Simulator
            derived-data: tvos
          - name: visionOS
            destination: generic/platform=visionOS Simulator
            derived-data: visionos
          - name: watchOS
            destination: generic/platform=watchOS Simulator
            derived-data: watchos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compile package and tests
        run: |
          xcodebuild \
            -scheme SwordKit \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '.build/xcode-${{ matrix.derived-data }}' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
